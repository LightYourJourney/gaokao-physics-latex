  不是插图，不收录。其余 16 张全部用 TikZ/circuitikz/pgfplots 矢量重绘：
  题面 image1（第 16 题秋千，人物与支架简化为示意图）、image2（第 17 题甲/乙）、
  image3（第 17 题四个 U_R-t 选项）、image4（第 18 题半圆磁场边界）、image5（第 20 题 E-s 图）、
  image6（第 21 题 U 形框与导体棒）、image7（第 22 题图甲）、image8（第 22 题图乙 U-I 图）、
  image9（第 23 题气垫导轨装置）、image10（第 25 题圆域截面）、image11（第 33 题 F-r 图）、
  image12（第 34 题等边三角形）；
  解析 image13（第 18 题轨迹）、image14（第 21 题 v-t 图）、image15（第 25 题几何图）、
  image21（第 34 题几何图）。
  无照片例外：原图均为线稿或可矢量化的示意图，未保留位图，未使用 photos/ 目录。
