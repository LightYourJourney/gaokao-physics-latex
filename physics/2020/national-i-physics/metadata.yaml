  解析修正与整理记录（题号 + 源问题 + 处理）：
  1) 第 17 题：源解析用“U_R1=CRU_C/1s”“U_R2=-CRU_C/2s”的简写，未标明 ΔU_C/Δt 的时间区间与符号来源。
     处理：改为按 0--1 s、1--2 s、2--3 s、3--5 s 分段说明，明确各段斜率正负与 2:1 的大小关系。
  2) 第 18 题：源解析“粒子射出位置从半圆顶端向下移动”表述不严谨，且未说明 r=R 时圆心角的几何来源。
     处理：改为“出射点由 a 沿圆弧向 b 移动”，补充 r=R 时两圆半径相等、圆心距为 R、构成等边三角形的论证。
  3) 第 21 题：源解析“由 bc 边切割磁感线产生电动势”易被误解为只有 bc 边切割。
     处理：明确 bc 边与 MN 棒同时切割，回路总电动势 E=Bl(v2-v1)，并区分“速度趋于恒定”与“加速度趋于恒定”。
  4) 第 22 题：源解析仅称“该电阻为大电阻”，未作误差量级比较。
     处理：补充 R_A/R_x≈1% 与 R_x/R_V≈5% 的对比，说明内接法更接近真实值；
     图线Ⅰ按 (20.0 mA, 1.01 V)、(60.0 mA, 3.03 V) 读取，斜率 50.5 Ω，与官方答案一致。
  5) 第 25 题：源解析第 (3) 问用 v2 同时表示“y 方向速度分量”和末速度，符号冲突；
     且原式后以 image16--image18 作公式编号占位。
     处理：沿电场方向的速度分量不再另设 v2，直接用 at=v0 与坐标方程联立；
     公式编号改为正常排版，补全圆的方程与两组解 x=0、x=√3R 的取舍说明。
  6) 第 23 题：源解析 (7) 直接给出 4%，未展示中间量。
     处理：按未四舍五入的 I=0.2205 N·s、Δp=0.2124 kg·m/s 计算，δ=3.7%≈4%，并说明有效数字。
  7) 第 16 题：源解析得 410 N，选项为 400 N。
     处理：保留 410 N 的计算结果并注明“最接近 400 N”，不将 410 N 当作精确等于选项值。
