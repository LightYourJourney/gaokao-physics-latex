  2) 第 20 题选项 C、D 的表达式 → 按「圆心在边界上、半圆有效面积 πr²/2」重建为
     C．BSr/(4ρ)、D．πr²B/(2t1)；推导过程写在解析中。
  3) 第 24 题 (1)(2) 的最终结果式（原卷式④、式⑦）→ 解析给出推导路径与中间式，最终式标注待核。
