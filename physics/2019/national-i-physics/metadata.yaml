  6) 第 34(2)(i) 的 x=7 m 与官方答案一致；(ii) 的 x' 数值在原卷为图片、缺失，
     解析给出 6√2−3 ≈ 5.5 m 并明确标注「待核」。
  7) 第 23(4) 的 k 值在原卷为图片、缺失，按「25 mA 调回 20 mA」给出 k=1/2，标注待核。
  8) 第 17 题：官方答案 B（1.5F）与「三边等电阻、M、N 接电源」标准模型的合力方向
     有关；解析给出两种合成方向的讨论，以官方答案为准并标注待核。

