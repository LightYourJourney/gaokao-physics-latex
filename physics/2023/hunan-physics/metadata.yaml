  源图与重绘的记号差异：第 6 题源解析图中，轨迹圆心与题干中的 GF 中点同标为 O；重绘图把题干的
  O 保留为 GF 中点，解析图的轨迹圆心改标 O′，以免歧义。

  解析修正记录（结论均与源答案一致，未改答案）：
  1) 第 3 题 D 项：源解析称 t=6 s 时 D 处质点与平衡位置相距 4 cm，实为 −2+2+2=+2 cm；
     选项 D（6 cm）仍错误，结论不变，解析按 2 cm 重写。
  2) 第 4 题 D 项：源解析逃逸速度表达式在转换中残缺（根号内混排），重写为 v逃∝M^{1/3}ρ^{1/6}，结论不变。
  3) 第 5 题：源解析以「Q1、Q3 在 P 点场强大小相等」排除 C 项，理由不成立（r1=h 与 r3=2h 不等距）；
     改为代入 x 分量式 3Q2+√3Q3=0 检验，结论 D 不变。
  4) 第 12(5) 题：源解析的电流不等式推导跳步且方向表述含混，改用戴维南等效论证
     （毫伏表内阻有限使 C、D 间电压小于开路电压），结论 F1>F0 不变。
  5) 第 11 题图乙：源栅格图周期数在低分辨率下难以辨认，按源文「0~t0 内 10 个完整波形」
     及其答案解析重绘为 10 个周期，答案 T=t0/10 与源一致。
  6) 第 15(2) 题：源解析的 x1′、x2′ 记号与位移关系表述跳跃，按动量守恒与椭圆约束重写推导，
     结果与源一致。

  复核范围：全部 15 题的符号、方向、量纲与有效数字；计算题的代入、单位与最终结论均逐步写出，
  选择题给出判断依据。
